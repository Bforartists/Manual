# Workspace maps (Docs 2.0). One entry per workspace page, in the app's tab order.
# image:  the screenshot (docs2/…).  source: auto = boxes found by docs2/tools/ws_areas.py from the
#         screenshot; capture = boxes from Bforartists itself (docs2/tools/ws_capture.py).
# areas:  ed = the editor (Bforartists ui_type, see `editors`), box = left, top, width, height in % of
#         the image, note = what this area is for in THIS workspace (one short line).
# Write a note in your own words any time; re-running the tools keeps notes.

editors:
  TOPBAR: {name: "Topbar", page: "editors/topbar-and-statusbar/index.md", icon: topbar, color: "#9a9a9a", does: "Menus, the workspace tabs and the main toolbar."}
  STATUSBAR: {name: "Statusbar", page: "editors/topbar-and-statusbar/index.md", icon: statusbar, color: "#9a9a9a", does: "Hints for the mouse buttons, and what Bforartists is doing."}
  VIEW_3D: {name: "3D Viewport", page: "editors/3d-viewport/index.md", icon: view3d, color: "#f2994a", does: "See and edit your scene in 3D."}
  IMAGE_EDITOR: {name: "Image Editor", page: "editors/image-editor/index.md", icon: image, color: "#c08cf2", does: "View, paint and save images and renders."}
  UV: {name: "UV Editor", page: "editors/uv-editor/index.md", icon: uv, color: "#c08cf2", does: "Lay out the UV map of a mesh over its texture."}
  ShaderNodeTree: {name: "Shader Editor", page: "editors/shader-editor/index.md", icon: node_material, color: "#5cb4f0", does: "Build materials and worlds with nodes."}
  CompositorNodeTree: {name: "Compositor", page: "editors/compositor/index.md", icon: node_compositing, color: "#5cb4f0", does: "Post-process renders with nodes."}
  GeometryNodeTree: {name: "Geometry Node Editor", page: "editors/geometry-node-editor/index.md", icon: geometry_nodes, color: "#5cb4f0", does: "Build and change geometry with nodes."}
  TextureNodeTree: {name: "Texture Node Editor", page: "editors/texture-node-editor.md", icon: node_texture, color: "#5cb4f0", does: "Make textures with nodes."}
  SEQUENCE_EDITOR: {name: "Video Sequence Editor", page: "editors/video-sequence-editor/index.md", icon: sequence, color: "#e8b84a", does: "Edit video, images and sound on a timeline."}
  CLIP_EDITOR: {name: "Movie Clip Editor", page: "editors/movie-clip-editor/index.md", icon: clip, color: "#e8b84a", does: "Track footage and draw masks."}
  DOPESHEET: {name: "Dope Sheet", page: "editors/dope-sheet/index.md", icon: action, color: "#8fd16a", does: "Every keyframe, to move and retime."}
  TIMELINE: {name: "Timeline", page: "editors/timeline/index.md", icon: time, color: "#8fd16a", does: "Playback, frame range and keying."}
  GRAPH_EDITOR: {name: "Graph Editor", page: "editors/graph-editor/index.md", icon: graph, color: "#8fd16a", does: "Shape animation curves."}
  DRIVERS: {name: "Drivers Editor", page: "editors/drivers-editor/index.md", icon: driver, color: "#8fd16a", does: "Let one value drive another."}
  NLA_EDITOR: {name: "Nonlinear Animation Editor", page: "editors/nonlinear-animation-editor/index.md", icon: nla, color: "#8fd16a", does: "Mix and layer actions."}
  TEXT_EDITOR: {name: "Text Editor", page: "editors/text-editor.md", icon: text, color: "#7ad0c4", does: "Write and run scripts and notes."}
  CONSOLE: {name: "Python Console", page: "editors/python-console.md", icon: console, color: "#7ad0c4", does: "Run Python one line at a time."}
  INFO: {name: "Info Editor", page: "editors/info-editor.md", icon: info, color: "#7ad0c4", does: "Reports, and the Python of every action."}
  OUTLINER: {name: "Outliner", page: "editors/outliner.md", icon: outliner, color: "#7ad0c4", does: "Everything in the scene, as a tree."}
  PROPERTIES: {name: "Properties Editor", page: "editors/properties/index.md", icon: properties, color: "#e86f5c", does: "Settings of the scene and the selected item, in tabs."}
  FILE_BROWSER: {name: "File Browser", page: "editors/file-browser.md", icon: filebrowser, color: "#e8b84a", does: "Find files on disk and drag them in."}
  ASSETS: {name: "Asset Browser", page: "editors/asset-browser/index.md", icon: asset_manager, color: "#e8b84a", does: "Browse and organize asset libraries."}
  SPREADSHEET: {name: "Spreadsheet", page: "editors/spreadsheet.md", icon: spreadsheet, color: "#7ad0c4", does: "Geometry data as rows and columns."}
  PREFERENCES: {name: "Preferences", page: "editors/preferences.md", icon: preferences, color: "#9a9a9a", does: "Set up Bforartists to your liking."}

