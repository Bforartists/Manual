# Pages CMS configuration: the online WYSIWYG editor for the Bforartists docs.
# Writers sign in at https://app.pagescms.org with GitHub, pick this repo and branch,
# and edit pages in a form + rich-text editor. Every save is a Git commit.
# Tier 1 points at docs2/; on the fresh main branch the docs2/ prefix goes away.

media:
  - name: images
    label: Image library
    input: docs2/images
    output: /docs2/images
    categories: [image]

content:
  - name: docs
    label: 📘 Documentation pages
    type: collection
    path: docs2/content
    subfolders: true
    format: yaml-frontmatter
    exclude: [README.md]
    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: others
      fields: [title, status, version]
      primary: title
      search: [title, id]
      sort: [title]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        default: draft
        options:
          values: [draft, needs-review, reviewed]
      - name: video
        label: Chapter video (YouTube link)
        type: string
        description: Optional. Shown at the top of the page.
      - name: shared
        label: Shared sections on this page
        type: reference
        description: Sections written once in Shared snippets. Each appears where the page links to it.
        options:
          collection: snippets
          multiple: true
          search: title
          value: "{path}"
          label: "{title}"
      - name: examples
        label: Example files to download
        type: file
        list: true
        description: Optional .blend or other files shown as downloads on the page.
      - name: body
        label: Page
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: images
          path: _inbox
          rename: safe
          extensions: [png, jpg, jpeg, webp, gif]
      # Set by the converter and the build. Shown read-only so writers can see them.
      - name: id
        label: Page ID (do not change)
        type: string
        readonly: true
      - name: slug
        label: Web address (do not change)
        type: string
        readonly: true
      - name: section
        label: Section
        type: string
        readonly: true
      - name: path
        label: Breadcrumb
        type: string
        list: true
        readonly: true
      - name: icon
        label: Icon name
        type: string
      - name: version
        label: Bforartists version
        type: string
        default: "5.1"
      - name: screenshots
        label: Screenshots taken in version
        type: string
      - name: source
        label: Converted from
        type: string
        list: true
        readonly: true

  - name: snippets
    label: ♻️ Shared snippets
    type: collection
    path: docs2/snippets
    format: yaml-frontmatter
    view:
      fields: [title, status]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        options:
          values: [draft, needs-review, reviewed]
      - name: body
        label: Shared section
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: images
          path: _inbox
          rename: safe
          extensions: [png, jpg, jpeg, webp, gif]
      - name: id
        label: Snippet ID (do not change)
        type: string
        readonly: true
      - name: version
        label: Bforartists version
        type: string
      - name: screenshots
        label: Screenshots taken in version
        type: string
      - name: source
        label: Converted from
        type: string
        list: true
        readonly: true

settings:
  content:
    merge: true          # keep front-matter keys the form does not list
  commit:
    identity: user       # commits carry the writer's name, for the credits page
    templates:
      create: "docs: add {path} (Pages CMS, {userName})"
      update: "docs: update {path} (Pages CMS, {userName})"
      delete: "docs: delete {path} (Pages CMS, {userName})"
      rename: "docs: move {oldPath} to {newPath} (Pages CMS, {userName})"
